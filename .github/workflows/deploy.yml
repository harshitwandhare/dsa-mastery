# Continuous deployment of web/ to Vercel.
#
# Production deploys on every push to main. `main` is protected and requires the
# full CI suite to pass before a merge lands, so anything that reaches this
# workflow has already been linted, type-checked, tested and built.
#
# Pull requests get their own preview URL, posted to the run summary, so a
# change can be looked at before it is merged rather than after.
#
# Requires these repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        — https://vercel.com/account/tokens
#   VERCEL_ORG_ID       — from web/.vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID   — from web/.vercel/project.json after `vercel link`
#
# Project: harshit-wandhare-s-projects/dsa-mastery
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# One deploy at a time per branch. A second push while the first is still
# uploading would otherwise race, and the loser could overwrite production with
# the older build.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned rather than @latest: every action in this repository is pinned, and a
  # deploy tool is the last place to accept an unreviewed automatic upgrade.
  VERCEL_CLI_VERSION: "56.3.1"

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    # Secrets are not exposed to forked pull requests, so skip rather than fail
    # with an authentication error that looks like a broken pipeline.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Fail early if the deploy credentials are missing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Pull the Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: |
          vercel build ${{ github.event_name == 'push' && '--prod' || '' }} \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt \
            ${{ github.event_name == 'push' && '--prod' || '' }} \
            --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Check the deployment actually serves the app
        # A green deploy step only means the upload succeeded. This confirms the
        # site responds and is really the learning platform, not an error page.
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o body.html -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ] && grep -qi "DSA Mastery" body.html; then
              echo "$url returned 200 and served the app."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code. Retrying in 10s."
            sleep 10
          done
          echo "::error::$url did not serve the app after 5 attempts (last status $code)."
          exit 1

      - name: Summarise
        run: |
          {
            echo "### ${{ github.event_name == 'push' && 'Production' || 'Preview' }} deploy"
            echo ""
            echo "<${{ steps.deploy.outputs.url }}>"
          } >> "$GITHUB_STEP_SUMMARY"
