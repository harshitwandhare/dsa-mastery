# ─────────────────────────────────────────────────────────────────────────────
# pre-commit hook configuration
# https://pre-commit.com
#
# Install:  uv run pre-commit install
# Run all:  uv run pre-commit run --all-files
#
# These mirror the CI gate so a red build is caught before it is pushed.
# ─────────────────────────────────────────────────────────────────────────────

default_language_version:
  python: python3.11

# The numbered lessons are the single source of truth and no hook may rewrite
# them. The whitespace fixers in particular would silently alter formatting that
# the content pipeline hashes into web/content/.
exclude: '^[0-9]{2}-[^/]*\.md$'

repos:
  # ── General file hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # ── Ruff: lint + format (replaces black, flake8, isort) ───────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Mypy: static type checking ────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [pytest]

  # ── Security: scan for leaked secrets ─────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ── YAML lint ─────────────────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yml]

  # ── The generated content must never drift from the markdown ──────────────
  - repo: local
    hooks:
      - id: content-in-sync
        name: web/content matches the curriculum
        entry: python tools/build_content.py
        language: system
        pass_filenames: false
        files: '^([0-9]{2}-.*\.md|practice/drills/.*\.py|tools/build_content\.py)$'
